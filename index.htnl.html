<style>
:root{--bg-dark:#f1f3f6;--bg-panel:#ffffff;--primary:#9a7614;--text-main:#1f2937;--text-muted:#6b7280;--border-light:1px solid #e2e5ea;--success:#15803d;--danger:#b91c1c;--warning:#1d4ed8;--info:#0e7490;--sidebar-w:260px}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{display:flex;min-height:100vh;background:var(--bg-dark);color:var(--text-main);overflow-x:hidden}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:rgba(0,0,0,.2)}::-webkit-scrollbar-thumb{background:var(--primary);border-radius:3px}
.sidebar{width:var(--sidebar-w);background:var(--bg-panel);border-right:var(--border-light);height:100vh;position:fixed;display:flex;flex-direction:column;z-index:10;transition:transform .3s}
.main{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column;min-height:100vh}
.header{background:var(--bg-panel);padding:12px 30px;border-bottom:var(--border-light);display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}
.content{padding:20px;flex:1;overflow-y:auto}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 15px;border-radius:4px;border:none;font-weight:600;text-transform:uppercase;cursor:pointer;transition:.2s;font-size:.8rem;letter-spacing:.5px}
.btn:hover{filter:brightness(1.2);transform:translateY(-1px)}
.btn-primary{background:var(--primary);color:#fff}.btn-success{background:var(--success);color:#fff}
.btn-danger{background:var(--danger);color:#fff}.btn-outline{background:transparent;border:1px solid #d1d5db;color:var(--text-main)}
.btn-info{background:var(--info);color:#fff}.btn-warning{background:var(--warning);color:#fff}.btn-sm{padding:5px 10px;font-size:.7rem}
input,select,textarea{width:100%;padding:10px 12px;background:#ffffff;border:1px solid #d1d5db;border-radius:4px;color:var(--text-main);font-size:.9rem;transition:border-color .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 2px rgba(154,118,20,.15)}
input[readonly]{background:#f3f4f6;color:var(--text-muted)}
label{display:block;font-size:.75rem;color:var(--primary);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px;margin-bottom:15px}
.card{background:var(--bg-panel);border:var(--border-light);border-radius:8px;padding:20px;margin-bottom:20px;position:relative;animation:cardIn .3s ease;box-shadow:0 1px 3px rgba(0,0,0,.06)}
@keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.badge{padding:3px 8px;border-radius:12px;font-size:.65rem;font-weight:700;text-transform:uppercase;white-space:nowrap}
.bg-success{background:rgba(21,128,61,.1);color:var(--success)}.bg-danger{background:rgba(185,28,28,.1);color:var(--danger)}
.bg-info{background:rgba(14,116,144,.1);color:var(--info)}.bg-warning{background:rgba(29,78,216,.1);color:var(--warning)}
table{width:100%;border-collapse:collapse}th,td{padding:10px 12px;text-align:left;border-bottom:1px solid #eceef1}
th{color:var(--text-muted);font-size:.75rem;text-transform:uppercase;background:#f8f9fb;font-weight:700}tbody tr:hover{background:#f8f9fb}
.text-danger{color:var(--danger);font-weight:bold}.text-success{color:var(--success);font-weight:bold}
.sidebar-header{padding:20px;text-align:center;border-bottom:var(--border-light)}
.sidebar-header h1{font-family:'Inter';font-weight:800;letter-spacing:.5px;font-size:1rem;color:var(--primary);margin-top:10px}
.sidebar nav{flex:1;overflow-y:auto;padding:10px 0}
.sidebar nav a{display:flex;align-items:center;gap:10px;padding:12px 20px;color:var(--text-muted);text-decoration:none;font-weight:600;border-left:3px solid transparent;transition:.2s;cursor:pointer;font-size:.9rem}
.sidebar nav a:hover,.sidebar nav a.active{background:rgba(154,118,20,.08);color:var(--text-main);border-left-color:var(--primary)}
#menuToggle{display:none}.toast-container{position:fixed;top:20px;right:20px;z-index:99999;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 18px;border-radius:6px;color:#fff;font-weight:600;font-size:.9rem;animation:slideIn .3s ease;min-width:220px;display:flex;align-items:center;gap:8px}
.toast-success{background:var(--success);color:#fff}.toast-danger{background:var(--danger)}.toast-info{background:var(--primary);color:#fff}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px;margin-bottom:20px}
.kpi-card{padding:20px;border-radius:8px;border-left:4px solid;display:flex;flex-direction:column;transition:transform .2s;background:var(--bg-panel)}
.kpi-card:hover{transform:translateY(-3px)}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:1000;display:none;overflow-y:auto;padding:20px}
.modal-overlay.show{display:block}
.modal-box{background:#ffffff;border:var(--border-light);border-radius:8px;width:100%;max-width:700px;margin:0 auto;animation:modalIn .25s ease;box-shadow:0 10px 40px rgba(0,0,0,.15)}
@keyframes modalIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
.modal-header{padding:15px 20px;border-bottom:1px solid #eceef1;display:flex;justify-content:space-between;align-items:center}
.modal-body{padding:20px;max-height:70vh;overflow-y:auto}.modal-footer{padding:15px 20px;border-top:1px solid #eceef1;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.search-box input{max-width:400px;background:#fff;border:1px solid #d1d5db}
#loginOverlay{position:fixed;inset:0;background:linear-gradient(135deg, #f4f5f7 0%, #e7e9ed 100%);display:flex;align-items:center;justify-content:center;z-index:9999}
.login-box{background:var(--bg-panel);padding:40px;border-radius:8px;border:1px solid var(--primary);width:350px;text-align:center}
.stock-card{background:rgba(0,180,216,.05);border:1px solid rgba(0,180,216,.2);padding:15px;border-radius:8px;text-align:center}
.alert-box{background:rgba(185,28,28,.08);border:1px solid var(--danger);color:var(--danger);padding:15px;border-radius:8px;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.notif-bell{position:relative;cursor:pointer;font-size:1.5rem;padding:5px}
.notif-badge{position:absolute;top:0;right:0;background:var(--danger);color:#fff;border-radius:50%;width:18px;height:18px;display:none;font-size:.7rem;text-align:center;line-height:18px;font-weight:bold;animation:pulse 2s infinite}
.offline-banner{background:var(--danger);color:#fff;text-align:center;padding:5px;font-size:.8rem;font-weight:bold;display:none}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.2)}100%{transform:scale(1)}}
@media(max-width:768px){.sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0);width:80vw;max-width:300px}.main{margin-left:0}#menuToggle{display:inline-flex!important}.form-row{grid-template-columns:1fr}.kpi-grid{grid-template-columns:1fr 1fr}.header{padding:10px 15px}.card{overflow-x:auto;-webkit-overflow-scrolling:touch}table{min-width:560px}.content{padding:12px}.modal-body{max-height:60vh}.login-box{width:90vw;max-width:350px;padding:25px}}
@media(max-width:480px){.kpi-grid{grid-template-columns:1fr}.header{gap:10px}.header>div{gap:8px!important}.btn{padding:7px 12px;font-size:.75rem}.btn-sm{padding:4px 8px;font-size:.65rem}.content{padding:10px}.card{padding:14px}.kpi-value{font-size:1.3rem}.sidebar.open{width:85vw}th,td{padding:8px 8px;font-size:.8rem}.notif-bell{font-size:1.2rem}}
@media(min-width:769px) and (max-width:1024px){.kpi-grid{grid-template-columns:repeat(2,1fr)}.sidebar{width:220px}.main{margin-left:220px}}
@media(max-width:768px){input,select,textarea{font-size:16px}}

.catalog-tabs { display: flex; gap: 5px; border-bottom: 2px solid #eceef1; margin-bottom: 20px; flex-wrap: wrap; }
.catalog-tab { background: transparent; border: none; color: var(--text-muted); padding: 10px 15px; cursor: pointer; font-weight: 600; border-bottom: 3px solid transparent; transition: 0.2s; font-size: .85rem; text-transform: uppercase; font-family: 'Inter', sans-serif; border-radius: 5px 5px 0 0; }
.catalog-tab:hover { color: var(--text-main); background: #f8f9fb; }
.catalog-tab.active { color: var(--primary); border-bottom-color: var(--primary); background: rgba(154,118,20,0.08); }

.pdf-report { font-family: 'Arial', Helvetica, sans-serif; color: #000000; padding: 30px; background: #ffffff; }
.pdf-report .pdf-header { text-align: center; margin-bottom: 30px; padding-bottom: 15px; border-bottom: 3px solid #000000; }
.pdf-report .pdf-header h2 { color: #000000; margin: 0 0 5px 0; font-size: 26px; text-transform: uppercase; letter-spacing: 1px; }
.pdf-report .pdf-header p { margin: 2px 0; font-size: 13px; color: #333333; }
.pdf-report h3 { color: #000000; font-size: 20px; margin: 25px 0 15px 0; padding-bottom: 5px; border-bottom: 2px solid #000000; }
.pdf-report h4 { color: #000000; font-size: 16px; margin: 20px 0 10px 0; text-transform: uppercase; }
.pdf-report h5 { color: #000000; font-size: 14px; background: #e6e6e6; padding: 10px; border-left: 4px solid #000000; }
.pdf-report table { width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 13px; }
.pdf-report th { background-color: #000000 !important; color: #ffffff !important; padding: 12px 8px; text-align: left; font-weight: bold; text-transform: uppercase; font-size: 12px; border: 1px solid #000000; }
.pdf-report td { padding: 10px 8px; border: 1px solid #555555; vertical-align: middle; color: #000000; }
.pdf-report tbody tr:nth-child(even) { background-color: #f2f2f2; }
.pdf-report .text-right { text-align: right; } .pdf-report .text-center { text-align: center; }
.pdf-report .text-danger { color: #cc0000; font-weight: bold; } .pdf-report .text-success { color: #008000; font-weight: bold; }
.pdf-report .summary-box { background: #e6e6e6; padding: 15px; border: 1px solid #000000; margin-bottom: 20px; }
.pdf-report .total-row td { background-color: #d4af37 !important; color: #000000 !important; font-weight: bold; font-size: 15px; border: 2px solid #000000; }
.pdf-report .signatures { margin-top: 60px; display: flex; justify-content: space-between; }
.pdf-report .sign-line { border-top: 2px solid #000000; width: 200px; text-align: center; padding-top: 5px; font-size: 12px; color: #000000; }
</style>

<body>

<div class="toast-container" id="toastContainer"></div>
<div id="offlineBanner" class="offline-banner">⚠️ SEM INTERNET - O sistema está a funcionar em modo offline. Os dados serão sincronizados quando a ligação regressar.</div>
<div id="modalGeneric" class="modal-overlay"><div class="modal-box"><div class="modal-header"><h2 id="modalTitle"></h2><span class="btn btn-outline" onclick="closeModal()">✕</span></div><div class="modal-body" id="modalBody"></div><div class="modal-footer" id="modalFooter"></div></div></div>

<nav class="sidebar" id="mainSidebar">
    <div class="sidebar-header">
        <h1>MINA JALIEZER</h1>
        <p style="font-size:.7rem;color:var(--text-muted)">Controlo Operacional (Nuvem Pro)</p>

<main class="main">
    <header class="header">
        <div style="display:flex;align-items:center;gap:10px">
            <button class="btn btn-outline" id="menuToggle" onclick="document.getElementById('mainSidebar').classList.toggle('open')">☰</button>
            <h1 style="font-family:'Inter';font-size:1.1rem"><span id="pageTitle">Dashboard</span></h1>

    <div class="content" id="appContent"><div style="text-align:center;padding:50px"><h2>A iniciar sistema...</h2></div></div>
</main>

<script>
/* ==================== SUPABASE CLOUD DATABASE ==================== */
const SUPABASE_URL = 'https://akovsuordjknkunfjqdp.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFrb3ZzdW9yZGprbmt1bmZqcWRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ0ODM0NjEsImV4cCI6MjEwMDA1OTQ2MX0.zcFKx8CdN7v1soGbOnwge5g8GXqamxZcMbrO8184-xM';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ---- Fila de sincronização offline ---- */
var SYNC_QUEUE_KEY = 'jaliezer_sync_queue';
function getLocalTable(t) { return JSON.parse(localStorage.getItem('offline_'+t) || '[]'); }
function setLocalTable(t, data) { localStorage.setItem('offline_'+t, JSON.stringify(data || [])); }
function getSyncQueue() { return JSON.parse(localStorage.getItem(SYNC_QUEUE_KEY) || '[]'); }
function setSyncQueue(q) { localStorage.setItem(SYNC_QUEUE_KEY, JSON.stringify(q)); updateOfflineBanner(); }
function queueSyncOp(op) { var q = getSyncQueue(); q.push(op); setSyncQueue(q); }
function updateOfflineBanner() {
    var b = document.getElementById('offlineBanner'); if(!b) return;
    var pending = getSyncQueue().length;
    if (!navigator.onLine) {
        b.style.display = 'block';
        b.innerText = '⚠️ SEM INTERNET - O sistema está a funcionar em modo offline. ' + (pending ? pending + ' alteração(ões) por sincronizar.' : 'Os dados serão sincronizados quando a ligação regressar.');
    } else if (pending > 0) {
        b.style.display = 'block';
        b.innerText = '🔄 A sincronizar ' + pending + ' alteração(ões) pendente(s)...';
    } else {
        b.style.display = 'none';
    }
}

var DB = {
    get: async function(t) { 
        try {
            const { data, error } = await sb.from(t).select('*'); 
            if (error) throw error;
            setLocalTable(t, data || []);
            return data || [];
        } catch(e) {
            console.warn('Offline GET:', t, e.message);
            return getLocalTable(t);
        }
    },
    insert: async function(t, r) { 
        try {
            const { data, error } = await sb.from(t).insert(r).select();
            if (error) throw error;
            var result = data ? data[0] : r;
            var local = getLocalTable(t); local.push(result); setLocalTable(t, local);
            return result;
        } catch(e) {
            console.warn('Offline INSERT (guardado localmente):', t, e.message);
            var localRec = Object.assign({}, r);
            var local = getLocalTable(t); local.push(localRec); setLocalTable(t, local);
            queueSyncOp({type:'insert', table:t, data: localRec});
            showToast('Sem ligação: guardado no dispositivo, será sincronizado depois.', 'info');
            return localRec;
        }
    },
    update: async function(t, id, newData) { 
        if(newData.date) {
            var d = parseDate(newData.date);
            if(d) {
                var mStr = d.getMonth()+'-'+d.getFullYear();
                var c = await this.get('company_config');
                var l = c[0] && c[0].locked_months ? c[0].locked_months.split(',') : [];
                if(l.includes(mStr)) { showToast('Mês bloqueado! Não pode editar.', 'danger'); return null; }
            }
        }
        try {
            const { data, error } = await sb.from(t).update(newData).eq('id', id).select();
            if (error) throw error;
            var result = data ? data[0] : newData;
            var local = getLocalTable(t); var idx = local.findIndex(function(x){return x.id===id;});
            if(idx > -1) { local[idx] = Object.assign({}, local[idx], result); setLocalTable(t, local); }
            return result;
        } catch(e) {
            console.warn('Offline UPDATE (guardado localmente):', t, e.message);
            var local = getLocalTable(t); var idx = local.findIndex(function(x){return x.id===id;});
            if(idx > -1) { local[idx] = Object.assign({}, local[idx], newData); setLocalTable(t, local); }
            queueSyncOp({type:'update', table:t, id:id, data:newData});
            showToast('Sem ligação: alteração guardada no dispositivo.', 'info');
            return newData;
        }
    },
    del: async function(t, id) { 
        try {
            var { data: recArr } = await sb.from(t).select('date').eq('id', id).limit(1);
            if(recArr && recArr.length > 0 && recArr[0].date) {
                var d = parseDate(recArr[0].date);
                if(d) {
                    var mStr = d.getMonth()+'-'+d.getFullYear();
                    var c = await this.get('company_config');
                    var l = c[0] && c[0].locked_months ? c[0].locked_months.split(',') : [];
                    if(l.includes(mStr)) { showToast('Mês bloqueado! Não pode apagar.', 'danger'); return; }
                }
            }
            const { error } = await sb.from(t).delete().eq('id', id);
            if (error) throw error;
            var local = getLocalTable(t); local = local.filter(function(x){return x.id!==id;}); setLocalTable(t, local);
        } catch(e) {
            console.warn('Offline DELETE (marcado para sincronizar):', t, e.message);
            var local = getLocalTable(t); local = local.filter(function(x){return x.id!==id;}); setLocalTable(t, local);
            queueSyncOp({type:'del', table:t, id:id});
            showToast('Sem ligação: remoção guardada no dispositivo.', 'info');
        }
    },
    save: async function(t, data) { 
        if (!data || data.length === 0) return; 
        try {
            const { error } = await sb.from(t).upsert(data);
            if (error) throw error;
            setLocalTable(t, data);
        } catch(e) {
            console.warn('Offline SAVE (guardado localmente):', t, e.message);
            setLocalTable(t, data);
            queueSyncOp({type:'save', table:t, data:data});
            showToast('Sem ligação: guardado no dispositivo.', 'info');
        }
    },
    syncPending: async function() {
        if (!navigator.onLine) return;
        var q = getSyncQueue();
        if (q.length === 0) { updateOfflineBanner(); return; }
        var remaining = [];
        for (var i = 0; i < q.length; i++) {
            var op = q[i];
            try {
                if (op.type === 'insert') { await sb.from(op.table).upsert(op.data); }
                else if (op.type === 'update') { await sb.from(op.table).update(op.data).eq('id', op.id); }
                else if (op.type === 'del') { await sb.from(op.table).delete().eq('id', op.id); }
                else if (op.type === 'save') { await sb.from(op.table).upsert(op.data); }
            } catch(e) {
                console.error('Falha ao sincronizar:', op, e.message);
                remaining.push(op);
            }
        }
        setSyncQueue(remaining);
        if (remaining.length === 0 && q.length > 0) { showToast('Sincronização completa! Todos os dados foram enviados.', 'success'); if (typeof currentNav !== 'undefined' && currentNav) navigate(currentNav); }
        else if (remaining.length > 0) { showToast(remaining.length + ' alteração(ões) ainda não sincronizada(s).', 'danger'); }
    }
};

/* ==================== SISTEMA DE PAGINAÇÃO UNIVERSAL ==================== */
var Pager = {
    state: {},
    init: function(tableId, allData, limit, rowRenderer, colspan) {
        this.state[tableId] = { data: allData, originalData: allData, limit: limit || 15, page: 1, render: rowRenderer, cols: colspan };
        this.render(tableId);
    },
    render: function(tableId) {
        var s = this.state[tableId];
        if(!s) return;
        var totalPages = Math.ceil(s.data.length / s.limit) || 1;
        if(s.page > totalPages) s.page = totalPages;
        if(s.page < 1) s.page = 1;
        var start = (s.page - 1) * s.limit;
        var pageData = s.data.slice(start, start + s.limit);
        var tbody = document.querySelector('#'+tableId+' tbody');
        if(tbody) {
            var html = '';
            if(pageData.length === 0) {
                html = '<tr><td colspan="'+esc(s.cols)+'" style="text-align:center;color:var(--text-muted);padding:20px">Nenhum registo encontrado.</td></tr>';
            } else {
                pageData.forEach(function(row) { html += s.render(row); });
            }
            tbody.innerHTML = html;
        }
        var pagerDiv = document.getElementById('pager_'+tableId);
        if(pagerDiv) {
            var pagerHtml = '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:15px;flex-wrap:wrap;gap:10px;">';
            pagerHtml += '<span style="font-size:.8rem;color:var(--text-muted);">Mostrando '+(pageData.length===0?0:start+1)+' a '+(start+pageData.length)+' de '+esc(s.data.length)+' registos</span>';
            pagerHtml += '<div style="display:flex;gap:5px;align-items:center;">';
            pagerHtml += '<button class="btn btn-outline btn-sm" '+(s.page <= 1 ? 'disabled style="opacity:.5;cursor:not-allowed;"' : '')+' onclick="Pager.go(\''+tableId+'\','+(s.page - 1)+')">⬅️</button>';
            var startPage = Math.max(1, s.page - 1);
            var endPage = Math.min(totalPages, s.page + 2);
            if(startPage > 1) pagerHtml += '<button class="btn btn-outline btn-sm" onclick="Pager.go(\''+tableId+'\',1)">1</button>';
            if(startPage > 2) pagerHtml += '<span style="color:var(--text-muted)">...</span>';
            for(var i=startPage; i<=endPage; i++) {
                if(i === s.page) pagerHtml += '<button class="btn btn-primary btn-sm" style="cursor:default;">'+i+'</button>';
                else pagerHtml += '<button class="btn btn-outline btn-sm" onclick="Pager.go(\''+tableId+'\','+i+')">'+i+'</button>';
            }
            if(endPage < totalPages-1) pagerHtml += '<span style="color:var(--text-muted)">...</span>';
            if(endPage < totalPages) pagerHtml += '<button class="btn btn-outline btn-sm" onclick="Pager.go(\''+tableId+'\','+totalPages+')">'+totalPages+'</button>';
            pagerHtml += '<button class="btn btn-outline btn-sm" '+(s.page >= totalPages ? 'disabled style="opacity:.5;cursor:not-allowed;"' : '')+' onclick="Pager.go(\''+tableId+'\','+(s.page + 1)+')">➡️</button>';
            pagerHtml += '</div></div>';
            pagerDiv.innerHTML = pagerHtml;
        }
    },
    go: function(tableId, pageNum) { if(this.state[tableId]) { this.state[tableId].page = pageNum; this.render(tableId); } },
    search: function(tableId, searchTerm) {
        var s = this.state[tableId]; if(!s) return; searchTerm = searchTerm.toLowerCase();
        var filtered = s.originalData.filter(function(row) { return Object.values(row).join(' ').toLowerCase().includes(searchTerm); });
        s.data = filtered; s.page = 1; this.render(tableId);
    }
};

function buildGroupedSelect(items, selectedItem) {
    var sorted = items.sort((a,b) => (a.name||'').localeCompare(b.name||''));
    var groups = {};
    sorted.forEach(c => {
        var g = c.group || 'Geral';
        if(!groups[g]) groups[g] = [];
        groups[g].push(c);
    });
    var html = '';
    Object.keys(groups).sort().forEach(g => {
        html += '<optgroup label="'+g+'">';
        groups[g].forEach(item => {
            html += '<option value="'+esc(item.name)+'" '+(selectedItem===item.name?'selected':'')+'>'+esc(item.name)+(item.unit?' ('+esc(item.unit)+')':'')+'</option>';
        });
        html += '</optgroup>';
    });
    return html;
}

/* Autenticação real via Supabase Auth. As credenciais nunca tocam no nosso código —
   o Supabase trata do hashing (bcrypt) e da sessão (JWT). Depois de autenticar,
   vamos buscar o perfil (nome/cargo) à tabela 'profiles', que é criada automaticamente
   por um trigger quando o utilizador é criado (ver ficheiro SQL de configuração). */
async function fetchProfile(authUser) {
    const { data, error } = await sb.from('profiles').select('*').eq('id', authUser.id).single();
    if (error || !data) { return null; }
    return { id: authUser.id, email: authUser.email, name: data.name || authUser.email, role: data.role || 'secretaria' };
}
async function login() {
    var email = val('loginUser'), pass = val('loginPass');
    if (!email || !pass) { showToast('Preencha email e palavra-passe.', 'danger'); return; }
    const { data, error } = await sb.auth.signInWithPassword({ email: email, password: pass });
    if (error || !data.user) { showToast('Credenciais inválidas!', 'danger'); return; }
    var profile = await fetchProfile(data.user);
    if (!profile) { showToast('Login feito, mas sem perfil associado. Contacte o administrador.', 'danger'); await sb.auth.signOut(); return; }
    currentUser = profile;
    document.getElementById('loginOverlay').style.display = 'none';
    logAction('Login', 'Entrou no sistema');
    initApp();
}

    if (allowedAlerts.includes('fuel')) { var fS = fuel.reduce((a,b)=>a + (b.type==='Entrada' ? b.litros : -b.litros),0); if (fS < 200) alerts.push({sector: 'Combustível', item: 'Gasóleo', qtd: fS + ' L'}); }
    if (allowedAlerts.includes('provisions')) { 
        var pS = {}; 
        prov.forEach(p => { var m = p.qty.match(/\d+/); var n = m ? parseInt(m[0]) : 0; if(!pS[p.item]) pS[p.item] = 0; pS[p.item] += (p.type === 'Entrada' ? n : -n); }); 
        for(var i in pS) { var catItem = catalog.find(c=>c.name===i); var minS = catItem ? (catItem.min_stock||5) : 5; if (pS[i] <= minS) alerts.push({sector: 'Alimentação', item: i, qtd: pS[i] + ' un.'}); } 
    }
    if (allowedAlerts.includes('construcao')) { 
        var cS = {}; 
        constLogs.forEach(c => { var m = c.qty.match(/\d+/); var n = m ? parseInt(m[0]) : 0; if(!cS[c.item]) cS[c.item] = 0; cS[c.item] += (c.type === 'Entrada' ? n : -n); }); 
        for(var i in cS) { var catItem = catalog.find(c=>c.name===i); var minS = catItem ? (catItem.min_stock||5) : 5; if (cS[i] <= minS) alerts.push({sector: 'Construção', item: i, qtd: cS[i] + ' un.'}); } 
    }
    if (allowedAlerts.includes('logistica_pecas')) { 
        var peS = {}; 
        pecas.forEach(p => { var m = p.qty.match(/\d+/); var n = m ? parseInt(m[0]) : 0; if(!peS[p.item]) peS[p.item] = 0; peS[p.item] += (p.type === 'Entrada' ? n : -n); }); 
        for(var i in peS) { var catItem = catalog.find(c=>c.name===i); var minS = catItem ? (catItem.min_stock||2) : 2; if (peS[i] <= minS) alerts.push({sector: 'Peças', item: i, qtd: peS[i] + ' un.'}); } 
    }
    if (allowedAlerts.includes('equipment')) { eqs.forEach(eq => { if(eq.nextMaint) { var lF = fuel.filter(f=>f.equipment === eq.name && f.hours).sort((a,b)=>parseFloat(b.hours)-parseFloat(a.hours))[0]; if(lF && parseFloat(lF.hours) >= parseFloat(eq.nextMaint)) alerts.push({sector: 'Manutenção', item: eq.name, qtd: 'Revisão! ('+esc(lF.hours)+'h)'}); } }); }
    if (allowedAlerts.includes('licenses')) { var t = new Date(); lics.forEach(l => { var e = parseDate(l.expiryDate); if(e) { var d = Math.ceil((e - t) / (1000 * 60 * 60 * 24)); if(d <= 30) alerts.push({sector: 'Licença', item: l.entity, qtd: d < 0 ? 'Expirado!' : 'Vence em '+d+'d'}); } }); }
    if (allowedAlerts.includes('documentos')) { var t2 = new Date(); var docs = await DB.get('document_records'); docs.forEach(dc => { if(dc.expiry_date) { var e2 = parseDate(dc.expiry_date); if(e2) { var d2 = Math.ceil((e2 - t2) / (1000 * 60 * 60 * 24)); if(d2 <= 30) alerts.push({sector: 'Documento', item: (dc.title||dc.doc_number), qtd: d2 < 0 ? 'Expirado!' : 'Vence em '+d2+'d'}); } } }); }
    var badge = document.getElementById('alertBadge');
    if(alerts.length > 0) { badge.style.display = 'block'; badge.innerText = alerts.length; } else { badge.style.display = 'none'; }
    window.currentAlerts = alerts;
}

            <tbody>`;
    
    var recentFins = fin.filter(f=>isInM(f.date)).reverse().slice(0, 8);

    </style>`;

    document.getElementById('appContent').innerHTML = html;

function renderDashChart(f, p, c, s, o) {

        type: 'doughnut', 
        data: { 
            labels: ['Combustível', 'Alimentação', 'Construção', 'Salários', 'Outras'], 
            datasets: [{

    fuel.forEach(f => { var c = f.centroCusto || 'Geral'; if(!centers[c]) centers[c] = {rec:0, desp:0}; if(f.type==='Saída') centers[c].desp += (f.val||0); });

async function processMonthlyPayroll() {
    var emps = await DB.get('employees'); if(!emps.length) return showToast('Nenhum funcionário registado','danger');
    var incSub = confirm("Deseja incluir o Subsídio de Férias e Natal (1/12 do salário) neste processamento?");
    var config = (await DB.get('company_config'))[0] || {name:'Mina Jaliezer', nif:'N/D', address:'Angola'};
    var today = new Date(); var html = '<div class="pdf-report" style="width:210mm;margin:auto"><div class="pdf-header"><h2>'+esc(config.name)+'</h2><p>Processamento de Salários - '+getMonthName(today.getMonth())+' '+today.getFullYear()+'</p></div>';
    var attLogs = await DB.get('attendance_logs'); var advLogs = await DB.get('hr_advances');
    emps.forEach(function(emp, idx) {
        var baseSal = emp.salary; var subs = incSub ? (emp.salary / 12) : 0; var baseCalc = baseSal + subs;
        var irt = calcIRT(baseCalc); var seg = (baseCalc * 0.03); 
        var faltas = attLogs.filter(f=> f.empId === emp.id && f.type === 'Falta Injustificada' && parseDate(f.date).getMonth() === today.getMonth() && parseDate(f.date).getFullYear() === today.getFullYear()).length;
        var advances = advLogs.filter(a=> a.empId === emp.id && parseDate(a.date).getMonth() === today.getMonth() && parseDate(a.date).getFullYear() === today.getFullYear()).reduce((a,b)=>a+(b.amount||0),0);

async function switchDocTab(tab, prefill) {
    ['emitir','anexar','historico','modelos'].forEach(function(t) { var el = document.getElementById('docTab_'+t); if(el) el.classList.remove('active'); });
    var active = document.getElementById('docTab_'+tab); if(active) active.classList.add('active');
    if(tab==='emitir') await loadDocEmitir(prefill);
    else if(tab==='anexar') await loadDocAnexar();
    else if(tab==='historico') await loadDocHistorico();
    else if(tab==='modelos') await loadDocModelos();

async function loadDocEmitir(prefill) {

async function renderDocFields() {
    var tplId = val('docTplSelect'); var area = document.getElementById('docFieldsArea'); var actions = document.getElementById('docActionsArea');
    if(!tplId) { area.innerHTML=''; actions.innerHTML=''; return; }
    var templates = await DB.get('document_templates'); var tpl = templates.find(function(t){return t.id===tplId;}); if(!tpl) return;
    var fields = tpl.fields || [];
    var prefillData = (window._docPrefill && window._docPrefill.data) || {};
    var html = '<div class="form-row" style="flex-wrap:wrap">';
    fields.forEach(function(f) { var v = prefillData[f.key]!==undefined ? prefillData[f.key] : ''; html += '<div style="min-width:220px;flex:1"><label>'+esc(f.label)+'</label><input id="docFld_'+esc(f.key)+'" value="'+esc(v)+'"></div>'; });
    html += '</div>';
    area.innerHTML = html;
    actions.innerHTML = '<button class="btn btn-primary" style="margin-top:15px" onclick="gerarDocumento()">📄 Gerar e Descarregar PDF</button>';

function fillDocTemplate(content, docNumber, issueDate, config, createdByName, data) {
    var out = content;
    out = out.split('{{numero}}').join(esc(docNumber));
    out = out.split('{{data_emissao}}').join(esc(issueDate));
    out = out.split('{{empresa}}').join(esc(config.name));
    out = out.split('{{nif_empresa}}').join(esc(config.nif));
    out = out.split('{{morada_empresa}}').join(esc(config.address));
    out = out.split('{{emitido_por}}').join(esc(createdByName));
    Object.keys(data||{}).forEach(function(k) { out = out.split('{{'+k+'}}').join(esc(data[k])); });
    return out;
}
async function gerarDocumento() {
    var tplId = val('docTplSelect'); if(!tplId) return showToast('Escolha um modelo','danger');
    var templates = await DB.get('document_templates'); var tpl = templates.find(function(t){return t.id===tplId;}); if(!tpl) return;
    var types = await DB.get('document_types'); var docType = types.find(function(t){return t.id===tpl.type_id;}); if(!docType) return showToast('Tipo de documento não encontrado','danger');
    var fields = tpl.fields || []; var data = {};
    for (var i=0;i<fields.length;i++) { var f = fields[i]; var v = val('docFld_'+f.key); data[f.key] = v; }
    var expiry = val('docExpiry');
    var config = (await DB.get('company_config'))[0] || {name:'Mina Jaliezer', nif:'N/D', address:'Angola'};
    var rpcRes = await sb.rpc('next_doc_number', { p_prefix: docType.prefix });
    if (rpcRes.error || !rpcRes.data) { showToast('Erro ao gerar número do documento (verifique se correu o SQL de configuração).', 'danger'); console.error(rpcRes.error); return; }
    var docNumber = rpcRes.data;
    var content = fillDocTemplate(tpl.content, docNumber, getTodayStr(), config, currentUser.name, data);
    var fullHtml = '<div id="docPrint" class="pdf-report" style="width:210mm;margin:auto;padding:15mm"><div class="pdf-header" style="display:flex;justify-content:space-between"><div><h3>'+esc(config.name)+'</h3><p style="font-size:.85rem">NIF: '+esc(config.nif)+' · '+esc(config.address)+'</p></div><div style="text-align:right"><p>Nº '+esc(docNumber)+'<br>Data: '+esc(getTodayStr())+'</p></div></div><hr style="border:1px solid #000;margin:15px 0">'+content+'</div>';
    var printArea = document.createElement('div'); printArea.innerHTML = fullHtml; document.body.appendChild(printArea);
    var opt = { margin: 5, filename: docNumber.replace(/\//g,'-')+'.pdf', image:{type:'jpeg',quality:1.0}, html2canvas:{scale:4,useCORS:true}, jsPDF:{unit:'mm',format:'a4',orientation:'portrait'} };
    showToast('A gerar documento...','info');
    html2pdf().set(opt).from(printArea.firstChild).save().then(async function(){
        printArea.remove();
        var record = { id:'doc'+Date.now(), type_id:docType.id, template_id:tpl.id, doc_number:docNumber, title:tpl.name, related_module:(window._docPrefill&&window._docPrefill.relatedModule)||null, related_id:(window._docPrefill&&window._docPrefill.relatedId)||null, data:data, file_base64:null, issue_date:getTodayStr(), expiry_date:expiry||null, status:'Emitido', created_by_name: currentUser.name };
        await DB.insert('document_records', record);
        showToast('Documento '+docNumber+' gerado com sucesso!');
        logAction('Documento Emitido', docNumber+' - '+tpl.name);
        window._docPrefill = null;
    });
}

async function loadConfig() {
    var c = (await DB.get('company_config'))[0] || {id:'c1', name:'', nif:'', address:'', ivaRate:14, bank:'', exchange_rate:920, locked_months:''};
    var lockedMonthsHtml = '<p style="font-size:.85rem;color:var(--text-muted);margin-bottom:10px">Selecione os meses que já foram processados pela contabilidade. Os meses bloqueados não podem ter registos apagados ou editados.</p><div class="form-row">';
    var today = new Date();
    for(var i=0; i<12; i++) { var d = new Date(today.getFullYear(), today.getMonth() - i, 1); var monthStr = d.getMonth()+'-'+d.getFullYear(); var isChecked = (c.locked_months || '').split(',').includes(monthStr) ? 'checked' : ''; lockedMonthsHtml += '<div style="display:flex;align-items:center;gap:5px"><input type="checkbox" id="lock_'+monthStr+'" value="'+monthStr+'" style="width:auto" '+isChecked+'> <label for="lock_'+monthStr+'" style="margin:0;color:var(--text-main)">'+getMonthName(d.getMonth())+' '+d.getFullYear()+'</label></div>'; }
    lockedMonthsHtml += '</div>';
    var html = '<h2>⚙️ Configurações do Sistema</h2><div class="card"><h3>Dados da Empresa</h3><div class="form-row"><div><label>Nome da Empresa *</label><input id="cName" value="'+esc(c.name)+'"></div><div><label>NIF *</label><input id="cNif" value="'+esc(c.nif)+'"></div></div><div class="form-row"><div><label>Endereço</label><input id="cAddr" value="'+esc(c.address)+'"></div><div><label>Taxa IVA (%)</label><input type="number" id="cIva" value="'+esc(c.ivaRate)+'"></div></div><div class="form-row"><div><label>Conta Bancária Principal</label><input id="cBank" value="'+esc(c.bank)+'"></div><div><label>Taxa Câmbio (USD->AOA)</label><input type="number" id="cExRate" value="'+(c.exchange_rate||920)+'"></div></div><button class="btn btn-success" onclick="saveConfig()">💾 Guardar Configurações</button></div><div class="card"><h3>🔒 Bloqueio Contabilístico de Mês</h3>'+lockedMonthsHtml+'</div><div class="card"><h3>💾 Backup e Restauro de Dados</h3><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn btn-info" onclick="exportBackup()">⬇️ Descarregar Backup (JSON)</button><label class="btn btn-warning" style="cursor:pointer">⬆️ Carregar Backup (Substitui Nuvem)<input type="file" id="importFile" accept=".json" style="display:none" onchange="importBackup(event)"></label></div></div>';
    document.getElementById('appContent').innerHTML = html;
}
async function saveConfig() {
    var lockedMonths = []; document.querySelectorAll('[id^="lock_"]').forEach(el => { if(el.checked) lockedMonths.push(el.value); });
    var obj = {id:'c1', name:val('cName'), nif:val('cNif'), address:val('cAddr'), ivaRate:parseFloat(val('cIva'))||14, bank:val('cBank'), exchange_rate:parseFloat(val('cExRate'))||920, locked_months: lockedMonths.join(',')}; 
    await DB.save('company_config', [obj]); showToast('Configurações salvas!'); 
}
async function exportBackup() {
    var tables = ['profiles','catalog_items','document_types','document_templates','document_records','fuel_logs','provisions_logs','construcao_logs','bens_diversos_logs','logistica_pecas','epis_logs','licenses_logs','contractors_logs','shift_logs','security_logs','attendance_logs','vacation_logs','employees','equipment','maintenance_logs','finance_logs','patrimony_logs','audit_logs','suppliers','production_logs','company_config','hr_advances','health_logs','medical_stock_logs'];
    var backup = {}; for(var i=0; i<tables.length; i++) { backup[tables[i]] = await DB.get(tables[i]); }
    var dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backup));
    var link = document.createElement('a'); link.href = dataStr; link.download = "Backup_Mina_Jaliezer_"+getTodayStr().replace(/\//g,'-')+".json"; document.body.appendChild(link); link.click(); link.remove(); showToast('Backup descarregado!','info');
}
function importBackup(event) {
    var file = event.target.files[0]; if(!file) return; var reader = new FileReader();
    reader.onload = async function(e) { try { var data = JSON.parse(e.target.result); if(confirm('ATENÇÃO: Isto vai APAGAR os dados da nuvem e substituir pelos dados do ficheiro. Continuar?')) { for(var table in data) { await DB.save(table, data[table]); } showToast('Backup restaurado!','success'); setTimeout(function(){ location.reload(); }, 2000); } } catch(err) { showToast('Erro: Ficheiro inválido.','danger'); } };
    reader.readAsText(file);
}

/* =================--- GESTÃO DE UTILIZADORES ---================= */
/* A partir daqui a gestão de acessos edita a tabela 'profiles' (nome + cargo).
   As credenciais de login (email/senha) já não passam pelo nosso código — são
   criadas no painel do Supabase (Authentication > Add user). Quando um utilizador

async function generateStockMap() {
    var sector = val('mapSector');
    var period = val('mapPeriod');
    var today = new Date();
    var start = new Date(today.getFullYear(), today.getMonth(), 1);
    var end = new Date(today.getFullYear(), today.getMonth() + 1, 0);
    
    if(period === 'trimester') { start = new Date(today.getFullYear(), today.getMonth() - 2, 1); }
    else if(period === 'semester') { start = new Date(today.getFullYear(), today.getMonth() - 5, 1); }
    else if(period === 'year') { start = new Date(today.getFullYear(), 0, 1); }
    else if(period === 'custom') {
        start = parseDate(val('mapStart'));
        end = parseDate(val('mapEnd'));
        if(!start || !end) return showToast('Datas inválidas. Use DD/MM/AAAA', 'danger');
    }
    
    var allData = [];
    if(sector === 'all' || sector === 'provisions_logs') { (await DB.get('provisions_logs')).forEach(p => allData.push({ sector: 'Alimentação', date: p.date, type: p.type, item: p.item, qty: p.qty, takenBy: p.takenBy, supplier: p.supplier })); }
    if(sector === 'all' || sector === 'construcao_logs') { (await DB.get('construcao_logs')).forEach(p => allData.push({ sector: 'Construção', date: p.date, type: p.type, item: p.item, qty: p.qty, takenBy: p.takenBy, supplier: p.supplier })); }
    if(sector === 'all' || sector === 'bens_diversos_logs') { (await DB.get('bens_diversos_logs')).forEach(p => allData.push({ sector: 'Bens Diversos', date: p.date, type: p.type, item: p.item, qty: p.qty, takenBy: p.takenBy, supplier: p.supplier })); }
    if(sector === 'all' || sector === 'logistica_pecas') { (await DB.get('logistica_pecas')).forEach(p => allData.push({ sector: 'Peças e Máquinas', date: p.date, type: p.type, item: p.item, qty: p.qty, takenBy: p.takenBy, supplier: p.supplier })); }
    if(sector === 'all' || sector === 'medical_stock_logs') { (await DB.get('medical_stock_logs')).forEach(p => allData.push({ sector: 'Saúde', date: p.date, type: p.type, item: p.item, qty: p.qty, takenBy: p.takenBy, supplier: p.supplier })); }
    if(sector === 'all' || sector === 'fuel_logs') { (await DB.get('fuel_logs')).forEach(p => allData.push({ sector: 'Combustível', date: p.date, type: p.type, item: p.fuelType, qty: p.litros + ' L', takenBy: p.empName, supplier: p.supplier })); }
    
    var items = {};
    var isAll = sector === 'all';
    
    allData.forEach(p => {
        var match = p.qty.match(/\d+/);
        var num = match ? parseInt(match[0]) : 0;
        var key = isAll ? (p.sector + '___' + p.item) : p.item;
        if(!items[key]) items[key] = { sector: p.sector, name: p.item, movements: [], initial: 0, in: 0, out: 0 };
        var d = parseDate(p.date);
        if(p.type === 'Entrada') {
            if(d < start) items[key].initial += num;
            else if(d >= start && d <= end) { items[key].in += num; items[key].movements.push(p); }
        } else {
            if(d < start) items[key].initial -= num;
            else if(d >= start && d <= end) { items[key].out += num; items[key].movements.push(p); }
        }
    });
    
    var html = '<table><thead><tr>';
    if(isAll) html += '<th>Setor</th>';
    html += '<th>Item</th><th class="text-right">Saldo Inicial</th><th class="text-right">Entradas no Período</th><th class="text-right">Saídas (Requisições)</th><th class="text-right">Saldo Final</th></tr></thead><tbody>';
    var hasData = false;
    var keys = Object.keys(items).sort();
    keys.forEach(key => {
        var it = items[key];
        if(it.movements.length > 0 || it.initial !== 0) {
            hasData = true;
            var final = it.initial + it.in - it.out;
            html += '<tr>';
            if(isAll) html += '<td><span class="badge bg-info">'+esc(it.sector)+'</span></td>';
            html += '<td><strong>'+esc(it.name)+'</strong><br><small>Movimentos no período: '+esc(it.movements.length)+'</small></td>';
            html += '<td class="text-right">'+esc(it.initial)+'</td>';
            html += '<td class="text-right text-success">'+esc(it.in)+'</td>';
            html += '<td class="text-right text-danger">'+esc(it.out)+'</td>';
            html += '<td class="text-right" style="font-weight:bold; '+(final < 0 ? 'color:#cc0000;' : 'color:#008000;')+'">'+final+'</td>';
            html += '</tr>';
            if(it.movements.length > 0) {
                html += '<tr><td colspan="'+(isAll ? 6 : 5)+'" style="padding:0;">';
                html += '<table style="width:100%; margin:0; font-size:11px;"><tbody>';
                it.movements.forEach(m => {
                    var dt = m.date;
                    var who = m.type === 'Saída' ? (m.takenBy||'-') : (m.supplier||'-');
                    html += '<tr style="background:#f9f9f9;"><td style="padding:5px 10px; border:none;">'+dt+'</td><td style="border:none;">'+esc(m.type)+'</td><td style="border:none;">'+esc(m.qty)+'</td><td style="border:none;">'+who+'</td><td style="border:none;"></td></tr>';
                });
                html += '</tbody></table>';
                html += '</td></tr>';
            }
        }
    });
    html += '</tbody></table>';
    if(!hasData) html = '<p style="text-align:center; padding:20px; color:#888;">Nenhum movimento encontrado neste período.</p>';
    document.getElementById('stockMapResult').innerHTML = html;
    showToast('Mapa gerado!','success');
}

        for(var eqName in groupedSaidas) { var eqEntries = groupedSaidas[eqName]; var eqTotLitros = 0, eqTotValor = 0; html += '<tr><td colspan="4" style="background-color:#e9ecef; padding:8px; font-weight:bold; border-top:2px solid #000;">🚗 ' + eqName + ' (Matrícula: ' + (eqEntries[0].plate || 'N/D') + ')</td></tr><tr class="tbl-head"><td style="padding:5px;">Data/Hora</td><td>Funcionário</td><td>Litros</td><td>Valor (Kz)</td></tr>'; eqEntries.forEach(f => { var valS = f.litros * 420; eqTotLitros += f.litros; eqTotValor += valS; html += '<tr class="tbl-body"><td style="padding:5px;">'+esc(f.date)+' '+esc(f.time)+'</td><td>'+esc(f.empName)+'</td><td>'+esc(f.litros)+'</td><td>'+fmt(valS)+'</td></tr>'; }); html += '<tr class="total-row"><td colspan="2" style="padding:5px;">TOTAL ' + eqName + '</td><td style="text-align:center;">'+fmt(eqTotLitros)+' L</td><td style="text-align:right;">'+fmt(eqTotValor)+'</td></tr>'; totLitros += eqTotLitros; totValor += eqTotValor; }

    } else if(type === 'finance') {

        data.forEach(f => { var valClass = f.type === 'Entrada' ? 'bg-success' : 'bg-danger'; html += '<tr class="tbl-body '+valClass+'"><td style="padding:5px;">'+esc(f.date)+'</td><td>'+esc(f.desc)+'</td><td>'+esc(f.type)+'</td><td>'+esc(f.status)+'</td><td>'+fmt(f.val)+'</td></tr>'; });

    } else {

        else if(type === 'provisions') { data = await DB.get('provisions_logs'); headers = ['Data', 'Tipo', 'Item', 'Qtd', 'Levantado', 'Custo']; tCost = data.filter(p=>p.type==='Entrada').reduce((a,b)=>a+(b.cost||0),0); }
        else if(type === 'construcao') { data = await DB.get('construcao_logs'); headers = ['Data', 'Tipo', 'Item', 'Qtd', 'Destino', 'Custo']; tCost = data.filter(p=>p.type==='Entrada').reduce((a,b)=>a+(b.cost||0),0); }
        else if(type === 'bens_diversos') { data = await DB.get('bens_diversos_logs'); headers = ['Data', 'Tipo', 'Item', 'Qtd', 'Entregue/Origem', 'Custo']; tCost = data.filter(p=>p.type==='Entrada').reduce((a,b)=>a+(b.cost||0),0); }

        else if(type === 'epis') { data = await DB.get('epis_logs'); headers = ['Data', 'Funcionário', 'EPI', 'Qtd', 'Autorizado']; }

        else if(type === 'equipment') { data = await DB.get('equipment'); headers = ['Nome', 'Marca', 'Tipo', 'Estado']; }
        if(headers.length > 0) {
            html += '<table style="width:100%; border-collapse:collapse; font-family:Arial; font-size:12px;"><tr><td colspan="'+esc(headers.length)+'" style="background-color:#2c3e50; color:#fff; padding:8px; font-weight:bold;">'+type.replace('_', ' ').toUpperCase()+'</td></tr><tr class="tbl-head">';
            headers.forEach(h => html += '<td style="padding:5px;">'+h+'</td>'); html += '</tr>';

}

/* ==================== INICIALIZAÇÃO ==================== */
window.onload = async function() {
    var loginHtml = '<div id="loginOverlay"><div class="login-box"><h1 style="font-family:Inter;color:var(--primary);margin-bottom:10px">MINA JALIEZER</h1><p style="color:var(--text-muted);margin-bottom:30px">Controlo Operacional (Nuvem Pro)</p><input type="email" id="loginUser" placeholder="Email" style="margin-bottom:15px"><input type="password" id="loginPass" placeholder="Palavra-passe" style="margin-bottom:20px"><button class="btn btn-primary" style="width:100%" onclick="login()">Entrar</button></div></div>';
    document.body.insertAdjacentHTML('beforeend', loginHtml);
    try {
        updateOfflineBanner();
        const { data: sessionData } = await sb.auth.getSession();
        if (sessionData && sessionData.session && sessionData.session.user) {
            var profile = await fetchProfile(sessionData.session.user);
            if (profile) {
                currentUser = profile;
                document.getElementById('loginOverlay').style.display = 'none';
                if (navigator.onLine) DB.syncPending();
                await seedData(); // só corre com sessão válida — as tabelas agora exigem autenticação (RLS)
                initApp();
            }
        }
    } catch(e) { console.error("Erro ao carregar dados iniciais:", e); showToast("Aviso: A ligação à nuvem demorou ou falhou. Pode fazer login em modo offline.", "info"); }
};
