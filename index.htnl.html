<style>

body{display:flex;min-height:100vh;background:var(--bg-dark);color:var(--text-main);overflow-x:hidden}

.btn:hover{filter:brightness(1.2);transform:translateY(-1px)}

.btn-danger{background:var(--danger);color:#fff}.btn-outline{background:transparent;border:1px solid rgba(255,255,255,.2);color:#fff}

th{color:var(--primary);font-size:.75rem;text-transform:uppercase;background:rgba(212,175,55,.05)}tbody tr:hover{background:rgba(212,175,55,.08)}

<script>
/* ==================== SUPABASE CLOUD DATABASE (COM OFFLINE E BLOQUEIO DE MÊS) ==================== */
const SUPABASE_URL = 'https://akovsuordjknkunfjqdp.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFrb3ZzdW9yZGprbmt1bmZqcWRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ0ODM0NjEsImV4cCI6MjEwMDA1OTQ2MX0.zcFKx8CdN7v1soGbOnwge5g8GXqamxZcMbrO8184-xM';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

var DB = {
    get: async function(t) { 
        const { data, error } = await sb.from(t).select('*'); 
        if (error) { console.error('Erro ao buscar:', t, error); return JSON.parse(localStorage.getItem('offline_'+t) || '[]'); } 
        localStorage.setItem('offline_'+t, JSON.stringify(data)); 
        return data || []; 
    },
    insert: async function(t, r) { 
        const { data, error } = await sb.from(t).insert(r).select();
        if (error) { console.error('Erro ao inserir (offline):', t, error); var local = JSON.parse(localStorage.getItem('offline_'+t) || '[]'); local.push(r); localStorage.setItem('offline_'+t, JSON.stringify(local)); return r; }
        return data ? data[0] : r; 
    },
    update: async function(t, id, newData) { 
        if(newData.date) {
            var d = parseDate(newData.date); 
            if(d) {
                var monthStr = d.getMonth()+'-'+d.getFullYear();
                var configData = await this.get('company_config');
                var locked = configData[0] && configData[0].locked_months ? configData[0].locked_months.split(',') : [];
                if(locked.includes(monthStr)) { showToast('Mês bloqueado contabilisticamente! Não pode editar.', 'danger'); return newData; }
            }
        }
        const { data, error } = await sb.from(t).update(newData).eq('id', id).select(); 
        if (error) console.error('Erro ao atualizar:', t, error); return data ? data[0] : newData; 
    },
    del: async function(t, id) { 
        var { data: recArr } = await sb.from(t).select('date').eq('id', id).limit(1);
        if(recArr && recArr.length > 0 && recArr[0].date) {
            var d = parseDate(recArr[0].date); 
            if(d) {
                var monthStr = d.getMonth()+'-'+d.getFullYear();
                var configData = await this.get('company_config');
                var locked = configData[0] && configData[0].locked_months ? configData[0].locked_months.split(',') : [];
                if(locked.includes(monthStr)) { showToast('Mês bloqueado contabilisticamente! Não pode apagar.', 'danger'); return; }
            }
        }
        const { error } = await sb.from(t).delete().eq('id', id); 
        if (error) console.error('Erro ao apagar:', t, error); 
    },
    save: async function(t, data) { if (!data || data.length === 0) return; const { error } = await sb.from(t).upsert(data); if (error) console.error('Erro ao guardar:', t, error); }
};

/* ==================== PWA & OFFLINE CONFIG ==================== */
var manifest = { "name": "ERP Mina Jaliezer", "short_name": "Jaliezer", "start_url": ".", "display": "standalone", "background_color": "#0a0a0a", "theme_color": "#0a0a0a", "icons": [{"src": "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' fill='%230a0a0a'/%3E%3Ctext x='50%25' y='50%25' font-size='100' text-anchor='middle' dy='.35em' fill='%23d4af37' font-family='sans-serif'%3E%E2%9B%8F%EF%B8%8F%3C/text%3E%3C/svg%3E", "sizes": "192x192", "type": "image/svg+xml"}] };

window.addEventListener('online', () => { document.getElementById('offlineBanner').style.display = 'none'; showToast('Ligação restaurada! Dados sincronizados.', 'success'); if(currentNav) navigate(currentNav); });

/* ==================== HELPERS ==================== */
function showToast(msg, type) { type = type || 'success'; var c = document.getElementById('toastContainer'), t = document.createElement('div'); t.className = 'toast toast-' + type; var icons = { success: '✅', danger: '❌', info: 'ℹ️' }; t.innerHTML = '<span>' + (icons[type] || '') + '</span><span>' + msg + '</span>'; c.appendChild(t); setTimeout(function() { t.remove(); }, 3000); }
function getTodayStr() { var d=new Date(); return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear(); }
function fmt(n) { return new Intl.NumberFormat('pt-AO', { minimumFractionDigits:2, maximumFractionDigits:2 }).format(n||0); }
function val(id) { var el = document.getElementById(id); return el ? el.value.trim() : ''; }
function modal(t, b, fn, txt, cls) { txt = txt || 'Salvar'; cls = cls || 'btn-primary'; document.getElementById('modalTitle').innerText = t; document.getElementById('modalBody').innerHTML = b; var footer = document.getElementById('modalFooter'); footer.innerHTML = '<button class="btn btn-outline" onclick="closeModal()">Fechar</button>'; if (fn) { var btn = document.createElement('button'); btn.className = 'btn ' + cls; btn.innerText = txt; btn.onclick = function() { fn(); }; footer.prepend(btn); } document.getElementById('modalGeneric').classList.add('show'); }
function closeModal() { document.getElementById('modalGeneric').classList.remove('show'); }
function parseDate(s) { if(!s) return null; var p = s.split('/'); if(p.length === 3) return new Date(p[2], p[1]-1, p[0]); return new Date(s); }
function getMonthName(mIdx) { var m=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro']; return m[mIdx]; }
function calcIRT(salario) { if (salario <= 70000) return 0; if (salario <= 100000) return (salario - 70000) * 0.10; if (salario <= 150000) return ((salario - 100000) * 0.15) + 3000; if (salario <= 250000) return ((salario - 150000) * 0.20) + 10500; if (salario <= 500000) return ((salario - 250000) * 0.25) + 30500; return ((salario - 500000) * 0.30) + 93000; }
var _filterTimeout = null;
function filterTable(el, tid) { clearTimeout(_filterTimeout); _filterTimeout = setTimeout(function() { var f = el.value.toLowerCase(); var tb = document.getElementById(tid); if (!tb) return; var rows = tb.getElementsByTagName('tr'); for (var i = 1; i < rows.length; i++) { var cells = rows[i].getElementsByTagName('td'); var m = false; for (var j = 0; j < cells.length; j++) { if (cells[j].innerText.toLowerCase().indexOf(f) > -1) m = true; } rows[i].style.display = m ? '' : 'none'; } }, 200); }
function hashPass(pass) { var hash = 0, i, chr; for (i = 0; i < pass.length; i++) { chr = pass.charCodeAt(i); hash = ((hash << 5) - hash) + chr; hash |= 0; } return 'h_' + Math.abs(hash).toString(16); }

function handleFileUpload(inputId, callback) { var file = document.getElementById(inputId).files[0]; if (!file) return callback(null); if (file.size > 1000000) { showToast('Ficheiro muito grande! Máx 1MB.', 'danger'); return callback(null); } var reader = new FileReader(); reader.onload = function(e) { callback(e.target.result); }; reader.readAsDataURL(file); }

async function login() {

    var found = users.find(function(x){ return x.user === u && x.pass === hashPass(p); });

/* ==================== ALERTAS (SINO DIRECIONADO E PUSH) ==================== */
async function checkAlerts() {
    var allowedAlerts = alertPermissions[currentUser.role] || [];
    var fuel = await DB.get('fuel_logs'), prov = await DB.get('provisions_logs'), constLogs = await DB.get('construcao_logs'), pecas = await DB.get('logistica_pecas'), eqs = await DB.get('equipment');
    var alerts = [];
    
    if (allowedAlerts.includes('fuel')) {
        var fuelStock = fuel.reduce(function(a,b){return a + (b.type==='Entrada' ? b.litros : -b.litros);},0);
        if (fuelStock < 200) alerts.push({sector: 'Combustível', item: 'Gasóleo/Gasolina', qtd: fuelStock + ' L'});
    }
    if (allowedAlerts.includes('provisions')) {
        var provStock = {}; 
        prov.forEach(function(p) { var match = p.qty.match(/\d+/); var num = match ? parseInt(match[0]) : 0; if(!provStock[p.item]) provStock[p.item] = 0; provStock[p.item] += (p.type === 'Entrada' ? num : -num); });
        for(var item in provStock) { if (provStock[item] <= 5) alerts.push({sector: 'Alimentação', item: item, qtd: provStock[item] + ' un.'}); }
    }
    if (allowedAlerts.includes('construcao')) {
        var constStock = {}; 
        constLogs.forEach(function(c) { var match = c.qty.match(/\d+/); var num = match ? parseInt(match[0]) : 0; if(!constStock[c.item]) constStock[c.item] = 0; constStock[c.item] += (c.type === 'Entrada' ? num : -num); });
        for(var itemC in constStock) { if (constStock[itemC] <= 5) alerts.push({sector: 'Construção', item: itemC, qtd: constStock[itemC] + ' un.'}); }
    }
    if (allowedAlerts.includes('logistica_pecas')) {
        var pecasStock = {}; 
        pecas.forEach(function(p) { var match = p.qty.match(/\d+/); var num = match ? parseInt(match[0]) : 0; if(!pecasStock[p.item]) pecasStock[p.item] = 0; pecasStock[p.item] += (p.type === 'Entrada' ? num : -num); });
        for(var itemP in pecasStock) { if (pecasStock[itemP] <= 2) alerts.push({sector: 'Peças e Máquinas', item: itemP, qtd: pecasStock[itemP] + ' un.'}); }
    }
    if (allowedAlerts.includes('equipment')) {
        eqs.forEach(function(eq) {
            if(eq.nextMaint) {
                var lastFuel = fuel.filter(function(f){ return f.equipment === eq.name && f.hours; }).sort(function(a,b){ return parseFloat(b.hours) - parseFloat(a.hours); })[0];
                if(lastFuel && parseFloat(lastFuel.hours) >= parseFloat(eq.nextMaint)) {
                    alerts.push({sector: 'Manutenção', item: eq.name, qtd: 'Revisão necessária! ('+lastFuel.hours+'h)'});
                }
            }
        });
    }
    
    var badge = document.getElementById('alertBadge');
    if(alerts.length > 0) { badge.style.display = 'block'; badge.innerText = alerts.length; } else { badge.style.display = 'none'; }
    
    if(alerts.length > 0 && 'Notification' in window && Notification.permission === 'granted') {
        if(!window.lastAlertCount || window.lastAlertCount < alerts.length) {
            new Notification('MINA JALIEZER - Alerta de Stock', { body: 'Existem ' + alerts.length + ' novos alertas críticos no sistema.' });
        }
    }
    window.lastAlertCount = alerts.length;
    window.currentAlerts = alerts;
}
function showAlertsModal() {
    var html = '<div style="max-height:400px; overflow-y:auto">';
    if(!window.currentAlerts || window.currentAlerts.length === 0) {
        html += '<p style="text-align:center; color:var(--text-muted); padding:20px">✅ Tudo ok! Sem alertas no momento.</p>';
    } else {
        window.currentAlerts.forEach(function(a) {
            html += '<div class="alert-box">⚠️ ALERTA: '+a.sector+' ('+a.item+') - '+a.qtd+'.</div>';
        });
        html += '<div style="text-align:right; margin-top:15px"><button class="btn btn-success btn-sm" onclick="sendWhatsAppAlert()">📱 Enviar Tudo p/ WhatsApp</button></div>';
    }

    modal('🔔 Central de Alertas', html, null, 'Fechar', 'btn-primary');
}

async function loadFuel() {

    var totGasto = data.filter(f=>f.type==='Entrada').reduce(function(a,b){return a+(b.val||0);},0);
    
    var totalComprado = data.filter(f=>f.type==='Entrada').reduce((a,b)=>a+(b.litros||0),0);
    var custoMedio = totalComprado > 0 ? totGasto / totalComprado : 0;
    var valorStock = totLitros * custoMedio;
    
    var html = '<div style="display:flex;justify-content:space-between;margin-bottom:15px;flex-wrap:wrap;gap:10px"><h2>⛽ Gestão de Combustível</h2><button class="btn btn-primary btn-sm" onclick="openModalFuel()">➕ Novo Movimento</button></div><div class="kpi-grid"><div class="kpi-card" style="background:rgba(0,180,216,.05);border-left-color:var(--info)"><div class="kpi-label">Stock Atual (Litros)</div><div class="kpi-value" style="color:#17a2b8">'+totLitros+' L</div></div><div class="kpi-card" style="background:rgba(255,0,110,.05);border-left-color:var(--danger)"><div class="kpi-label">Total Compras</div><div class="kpi-value" style="color:var(--danger)">'+fmt(totGasto)+' Kz</div></div><div class="kpi-card" style="background:rgba(0,255,136,.05);border-left-color:var(--success)"><div class="kpi-label">Valor do Stock (Custo Médio)</div><div class="kpi-value" style="color:var(--success)">'+fmt(valorStock)+' Kz</div></div></div>';
    html += '<div class="card"><div class="form-row" style="margin-bottom:10px"><div><label>De (Data)</label><input type="date" id="fuelStartDate" onchange="filterFuelDate()"></div><div><label>Até (Data)</label><input type="date" id="fuelEndDate" onchange="filterFuelDate()"></div></div><input type="text" class="search-box" placeholder="🔍 Pesquisar..." oninput="filterTable(this,\'tblFuel\')" style="margin-bottom:10px"><table id="tblFuel"><thead><tr><th>Data</th><th>Tipo</th><th>Litros</th><th>Equipamento</th><th>Horóm/Km</th><th>Rendimento</th><th>Valor</th><th>Ações</th></tr></thead><tbody>';
    var saidas = data.filter(function(f){ return f.type === 'Saída'; }).sort(function(a,b){ return parseDate(a.date) - parseDate(b.date); });
    var display = paginate(data.reverse(), 50);
    display.forEach(function(f) { 
        var typeClass = f.type==='Entrada' ? 'bg-success' : 'bg-warning'; var rendimento = '-';
        if(f.type === 'Saída' && f.hours) {
            var prevLog = saidas.filter(function(s){ return s.equipment === f.equipment && parseDate(s.date) < parseDate(f.date) && s.hours; }).pop();
            if(prevLog) { var diff = parseFloat(f.hours) - parseFloat(prevLog.hours); if(diff > 0) rendimento = (f.litros / diff).toFixed(2) + ' L/h'; }
        }
        html += '<tr data-date="'+f.date+'"><td>'+f.date+'<br><small>'+f.time+'</small></td><td><span class="badge '+typeClass+'">'+f.type+'</span></td><td>'+f.litros+' L</td><td><strong>'+f.equipment+'</strong><br><small>'+(f.plate||'-')+'</small></td><td>'+(f.hours||'-')+'</td><td>'+(rendimento)+'</td><td>'+fmt(f.val)+'</td><td style="white-space:nowrap"><button class="btn btn-warning btn-sm" onclick="openModalFuel(\''+f.id+'\')">✏️</button> <button class="btn btn-danger btn-sm" onclick="delFuel(\''+f.id+'\')">🗑️</button></td></tr>'; 
    });
    if(!display.length) html += '<tr><td colspan="8" style="text-align:center;color:var(--text-muted)">Nenhum registo.</td></tr>';

function scanQRCode(inputId) {
    if(typeof Html5Qrcode === 'undefined') return showToast('Leitor QR não carregou. Verifique a internet.', 'danger');
    modal('📷 Ler Código QR', '<div id="qr-reader" style="width:100%"></div><p style="text-align:center;margin-top:10px">Aponte a câmara para o equipamento...</p>', async function(){ 
        if(window.qrScanner) window.qrScanner.stop().catch(()=>{}); closeModal(); 
    }, 'Fechar', 'btn-outline');
    
    window.qrScanner = new Html5Qrcode("qr-reader");
    window.qrScanner.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 250, height: 250 } }, 
    (decodedText) => {
        var el = document.getElementById(inputId);
        if(el.tagName === 'SELECT') {
            var opt = Array.from(el.options).find(o => o.text.includes(decodedText) || o.value.includes(decodedText));
            if(opt) { el.value = opt.value; if(el.onchange) el.onchange(); showToast('QR Lido: ' + decodedText); } else { showToast('Veículo não encontrado: ' + decodedText, 'danger'); }
        } else {
            el.value = decodedText;
        }
        window.qrScanner.stop().then(() => { closeModal(); });
    }, (errorMessage) => { /* Ignore scan errors */ });
}

function exportPDF() { if(!val('reportType')) return showToast('Selecione um relatório primeiro','danger'); var element = document.getElementById('reportPrintArea'); var opt = { margin: 10, filename: 'Relatorio_Mina_Jaliezer.pdf', image: { type: 'jpeg', quality: 1.0 }, html2canvas: { scale: 4, useCORS: true, backgroundColor: '#ffffff' }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }, pagebreak: { mode: ['avoid-all', 'css', 'legacy'] } }; showToast('A gerar PDF...','info'); html2pdf().set(opt).from(element).save(); }
async function exportCSV() {
    var type = val('reportType'); if(!type) return showToast('Selecione um relatório','danger');
    var data = []; var headers = []; var fileName = "Relatorio_" + type + ".csv";
    
    if(type === 'production') { data = await DB.get('production_logs'); headers = ['Data', 'Hora', 'Poço', 'Material', 'Volume', 'Quilates', 'Teor', 'Responsável']; }
    else if(type === 'fuel') { data = await DB.get('fuel_logs'); headers = ['Data', 'Hora', 'Tipo', 'Combustível', 'Litros', 'Equipamento', 'Matrícula', 'Funcionário', 'Horómetro', 'Valor (Kz)']; }
    else if(type === 'provisions') { data = await DB.get('provisions_logs'); headers = ['Data', 'Tipo', 'Item', 'Qtd', 'Levantado Por', 'Autorizado Por', 'Custo (Kz)']; }
    else if(type === 'construcao') { data = await DB.get('construcao_logs'); headers = ['Data', 'Tipo', 'Item', 'Qtd', 'Levantado Por', 'Autorizado Por', 'Destino', 'Poço', 'Custo (Kz)']; }
    else if(type === 'logistica_pecas') { data = await DB.get('logistica_pecas'); headers = ['Data', 'Tipo', 'Categoria', 'Peça', 'Qtd', 'Máquina', 'Levantado/Compra', 'Autorizado Por', 'Custo (Kz)']; }
    else if(type === 'seguranca') { data = await DB.get('security_logs'); headers = ['Data', 'Hora', 'Tipo', 'Nome', 'Matrícula/ID', 'Destino', 'Guarda', 'Obs']; }
    else if(type === 'equipment') { data = await DB.get('equipment'); headers = ['Nome', 'Marca', 'Tipo', 'Matrícula', 'Preço Compra', 'Próx. Revisão', 'Estado']; }
    else if(type === 'finance') { data = await DB.get('finance_logs'); headers = ['Data', 'Descrição', 'Conta', 'Tipo', 'Valor (Kz)', 'IVA (Kz)', 'Estado', 'Poço']; }
    
    if(headers.length === 0) return showToast('Relatório não suportado para Excel','danger');
    if(data.length === 0) return showToast('Sem dados para exportar','danger');

    var csvContent = headers.join(';') + '\n';
    data.forEach(function(row) {
        var rowArray = [];
        if(type === 'production') rowArray = [row.date, row.time, row.well, row.material, row.qty, row.yield, (row.yield && row.qty ? (row.yield / parseFloat(row.qty.match(/\d+/)[0])).toFixed(3) : '-'), row.responsible];
        else if(type === 'fuel') rowArray = [row.date, row.time, row.type, row.fuelType, row.litros, row.equipment, row.plate, row.empName, row.hours, row.val];
        else if(type === 'provisions') rowArray = [row.date, row.type, row.item, row.qty, row.takenBy, row.authBy, row.cost];
        else if(type === 'construcao') rowArray = [row.date, row.type, row.item, row.qty, row.takenBy, row.authBy, row.destination, row.centroCusto, row.cost];
        else if(type === 'logistica_pecas') rowArray = [row.date, row.type, row.cat, row.item, row.qty, row.machine, (row.takenBy||row.supplier), row.authBy, row.cost];
        else if(type === 'seguranca') rowArray = [row.date, row.time, row.type, row.name, row.ident, row.dest, row.guard, row.obs];
        else if(type === 'equipment') rowArray = [row.name, row.brand, row.type, row.plate, row.buyPrice, row.nextMaint, row.status];
        else if(type === 'finance') rowArray = [row.date, row.desc, row.account, row.type, row.val, row.iva, row.status, row.centroCusto];
        var escapedArray = rowArray.map(function(cell) { return (cell !== undefined && cell !== null) ? String(cell).replace(/;/g, ',') : ''; });
        csvContent += escapedArray.join(';') + '\n';
    });

    var blob = new Blob(["\ufeff" + csvContent], {type: "text/csv;charset=utf-8;"});
    var link = document.createElement("a"); var url = URL.createObjectURL(blob);
    link.setAttribute("href", url); link.setAttribute("download", fileName); link.style.visibility = 'hidden';
    document.body.appendChild(link); link.click(); document.body.removeChild(link);
    showToast('Relatório Excel exportado!','success');
}
